resources:
  jobs:
    entrenamiento_nba_job:
      name: "Entrenamiento_Modelo_NBA"
      tasks:
        - task_key: "train_task"
          new_cluster:
            spark_version: "14.3.x-scala2.12"
            node_type_id: "Standard_DS3_v2"
            num_workers: 1
          notebook_task:
            notebook_path: ../src/train_model.py
            base_parameters:
              catalog: ${var.catalog_name}  # Inyectamos la variable